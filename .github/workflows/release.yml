name: Release Billio (Windows EXE & Android APK)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.24)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Frontend
        env:
          VITE_CONVEX_URL: "https://harmless-reindeer-189.convex.cloud"
        run: npm run build

      - name: Package Windows Installer & EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CONVEX_URL: "https://harmless-reindeer-189.convex.cloud"
        run: npx electron-builder --win -p never

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Get-ChildItem -Path release -Filter "Billio-Setup*.exe" | Copy-Item -Destination dist-release/
          if (Test-Path release/latest.yml) { Copy-Item release/latest.yml -Destination dist-release/ }
          if (Test-Path release/*.blockmap) { Copy-Item release/*.blockmap -Destination dist-release/ }
          Get-ChildItem dist-release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend & Sync Capacitor
        env:
          VITE_CONVEX_URL: "https://harmless-reindeer-189.convex.cloud"
        run: |
          npm run build
          npx cap sync android

      - name: Setup Android SDK 36 Packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-apk
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="latest"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Billio-${TAG_NAME}.apk
          ls -la dist-apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: dist-apk/*

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Determine Release Tag & Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PKG_VERSION}"
          fi
          # Ensure tag starts with v
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=Release ${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
